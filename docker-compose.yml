services:
  godot-profile-viewer:
    build:
      context: .
      args:
        GODOT_IMAGE: ${GODOT_IMAGE:-quay.io/decentraland/godot-explorer:be6db73f926425785932d9b6aa8b97c43beafb91}
    image: godot-profile-viewer:dev
    container_name: godot-profile-viewer
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3001}:3000"
    environment:
      CATALYST_URL_ORG: ${CATALYST_URL_ORG:-https://peer.decentraland.org}
      CATALYST_URL_ZONE: ${CATALYST_URL_ZONE:-https://peer.decentraland.zone}
      RENDER_TIMEOUT_MS: ${RENDER_TIMEOUT_MS:-120000}
      DATA_DIR: /data
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
